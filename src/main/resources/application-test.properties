spring.application.name=Q.Go
server.port=${PORT:8080}
server.address=0.0.0.0

# H2 데이터베이스 설정 (가장 기본적인 설정)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 콘솔 활성화
spring.h2.console.enabled=true

# JPA/Hibernate 설정
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# OAuth 설정 (Railway 환경변수 사용)
kakao.client-id=${KAKAO_CLIENT_ID:d1847048a1f58aeb83b34e2914f689c8}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:kakaod1847048a1f58aeb83b34e2914f689c8://oauth}

# JWT 설정
jwt.secret=${JWT_SECRET:my-very-secret-and-long-jwt-key-for-test-123456789}

# JPA/Hibernate 간소화
spring.jpa.open-in-view=false

# JSON 설정
spring.jackson.serialization.write-dates-as-timestamps=false

# 로깅
logging.level.root=INFO
logging.level.com.locquest=DEBUG