spring.application.name=Q.Go
server.port=${PORT:8080}
server.address=0.0.0.0

# HTTP 인코딩 설정
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# SQL 스크립트 인코딩 설정
spring.sql.init.encoding=UTF-8

# Railway MySQL Database - 환경변수로 설정됨 (fallback으로 H2 사용)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:locquest;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# H2 콘솔 활성화 (개발용)
spring.h2.console.enabled=true

# JPA 설정  
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.database-platform=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# 데이터 초기화 설정 - 테이블 생성 후 실행
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Kakao OAuth - 환경변수로 설정
kakao.client-id=${KAKAO_CLIENT_ID}
kakao.redirect-uri=${KAKAO_REDIRECT_URI}

# JWT Secret - 환경변수로 설정
jwt.secret=${JWT_SECRET}

# JSON 설정
spring.jackson.serialization.write-dates-as-timestamps=false

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AWS S3 - 환경변수로 설정
cloud.aws.region.static=${AWS_REGION:ap-northeast-2}
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
cloud.aws.s3.bucket=${S3_BUCKET_NAME}

# Logging
logging.level.com.locquest=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN